# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # desabilita telemetria e mensagens de boas-vindas do dotnet
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  TESTCONTAINERS_RYUK_DISABLED: true
  # desabilita o Ryuk no CI — runners não suportam containers privilegiados

jobs:

  # ────────────────────────────────────────────────────────────
  # JOB 1 — Build
  # Valida que o código compila antes de rodar qualquer teste
  # ────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Salva os binários para os jobs seguintes não precisarem rebuildar
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            **/bin/Release/
            **/obj/
          retention-days: 1
          # ↑ artefato temporário — só precisa durar enquanto o pipeline roda

  # ────────────────────────────────────────────────────────────
  # JOB 2 — Testes Unitários
  # Rápidos, sem dependências externas
  # ────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    # ↑ só executa se o build passou

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Run Unit Tests
        run: |
          dotnet test tests/LibraryManager.Unit.Tests \
            --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage/unit \
            --logger "trx;LogFileName=unit-results.trx"
      - name: List coverage files
        if: always()
        run: find ./coverage -name "*.xml" 2>/dev/null || echo "Nenhum XML encontrado"

      - name: Upload unit coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-unit
          path: ./coverage/unit
          if-no-files-found: warn

  # ────────────────────────────────────────────────────────────
  # JOB 3 — Testes de Integração e E2E
  # Requer Docker — Testcontainers sobe MongoDB
  # ────────────────────────────────────────────────────────────
  integration-tests:
    name: Integration + E2E Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    # ↑ só executa se os testes unitários passaram

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Run Integration Tests
        run: |
          dotnet test tests/LibraryManager.Integration.Tests \
            --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage/integration \
            --logger "trx;LogFileName=integration-results.trx"

      - name: Run E2E Tests
        run: |
          dotnet test tests/LibraryManager.E2E.Tests \
            --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage/e2e \
            --logger "trx;LogFileName=e2e-results.trx"

      - name: Upload integration coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-integration
          path: ./coverage/integration/**/coverage.cobertura.xml

      - name: Upload E2E coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-e2e
          path: ./coverage/e2e/**/coverage.cobertura.xml

  # ────────────────────────────────────────────────────────────
  # JOB 4 — Relatório de Cobertura
  # Consolida XMLs de todos os jobs e publica o relatório
  # ────────────────────────────────────────────────────────────
  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: integration-tests
    if: always()
    # ↑ gera o relatório mesmo se algum teste falhou
    #   para ver quais áreas estão descobertas

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Baixa os XMLs de cobertura dos três jobs anteriores
      - name: Download unit coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-unit
          path: ./coverage/unit

      - name: Download integration coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-integration
          path: ./coverage/integration

      - name: Download E2E coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-e2e
          path: ./coverage/e2e

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate Coverage Report
        run: |
          reportgenerator \
            -reports:"./coverage/**/coverage.cobertura.xml" \
            -targetdir:"./coverage/report" \
            -reporttypes:"Html;Cobertura;Badges;TextSummary" \
            -assemblyfilters:"+LibraryManager.Domain;+LibraryManager.Application;+LibraryManager.Infrastructure;+LibraryManager.Api" \
            -classfilters:"-*Tests*;-Microsoft.AspNetCore*;-System.*;-Program" \
            -title:"LibraryManager Coverage Report" \
            -tag:"${{ github.sha }}"
            # ↑ usa o SHA completo do commit no CI

      - name: Print coverage summary
        run: cat ./coverage/report/Summary.txt

      # Publica o relatório HTML como artefato navegável
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./coverage/report
          retention-days: 30
          # ↑ mantém por 30 dias — útil para auditar histórico

      # Comenta o resumo de cobertura diretamente no PR
      - name: Comment coverage on PR
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request'
        # ↑ só comenta em PRs, não em pushes diretos
        with:
          header: coverage-report
          path: ./coverage/report/Summary.txt

      - name: Deploy coverage report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        # ↑ só publica quando o push é na main — não em PRs
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./coverage/report
          destination_dir: coverage